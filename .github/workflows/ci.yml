name: CI

# Exists because a gate nobody runs is not a gate. `npm run typecheck` sat red
# for three consecutive tasks during development without anyone noticing: the
# per-task reviewers were scoped to a diff and structurally could not see a
# project-wide gate go red, and the human running them stopped checking between
# tasks. This workflow is the fix for the class, not just that instance.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Runs BOTH tsconfigs. tsconfig.json is restricted to @types/k6 so a
      # k6-executed file cannot reference `process` and typecheck clean while
      # failing at runtime; tsconfig.node.json covers the two Node CLI
      # entrypoints and the vitest suite. Skipping either defeats the split.
      - name: Typecheck
        run: npm run typecheck

      # Includes tests/wrapper/run-sh.test.ts, which stubs k6 to assert
      # bin/run.sh propagates exit 99. That is the CI gate a later sub-project
      # depends on; a wrapper that swallows it makes every failing load test
      # report success with no visible symptom.
      - name: Test
        run: npm test

      # The bundles are what ship in the image. Building them here catches an
      # esbuild-level break that the unit tests would not.
      - name: Build CLI bundles
        run: npm run build:cli

      - name: Verify bundles are standalone
        run: |
          # The image carries no node_modules, so a bundle that still resolves
          # a dependency at runtime would fail only inside the container.
          mv node_modules /tmp/nm
          node dist/timeline-cli.js < /dev/null
          node dist/index-cli.js index <<< '{"run":{"run_id":"ci"}}' > /dev/null
          mv /tmp/nm node_modules
