# Image pipeline. Builds the two images this repo ships — the generator
# (Dockerfile's default target) and the operator-side launcher (`--target
# launcher`) — and publishes them to this project's GitLab Container Registry:
#
#   $CI_REGISTRY_IMAGE:<short-sha>            generator, plus :latest
#   $CI_REGISTRY_IMAGE/launcher:<short-sha>   launcher,  plus :latest
#   ...:<tag> for a git tag
#
# Only changes that reach an image trigger a build: see `.image-paths`. A
# merge that touches docs/, tools/, tests/, aggregator-configs/ or the GitHub
# workflow alone builds nothing. Merge requests build and smoke-test the
# images without publishing; the default branch and tags publish.
#
# Same conventions as the vector-fips pipeline: docker:27 + dind, registry
# login from CI_REGISTRY_USER/PASSWORD, shell scripts under ci/ doing the
# work so the YAML stays declarative. Hardened bases are supplied as CI/CD
# variables (BASE_IMAGE, LAUNCHER_BASE_IMAGE), never committed.

stages: [validate, publish]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  GENERATOR_IMAGE: $CI_REGISTRY_IMAGE
  LAUNCHER_IMAGE: $CI_REGISTRY_IMAGE/launcher

# Everything that is COPYed into an image or drives its build. Anything not
# listed here cannot change what ships, so it must not trigger a build.
.image-paths: &image-paths
  - Dockerfile
  - .dockerignore
  - src/**/*
  - bin/**/*
  - profiles/**/*
  - protos/**/*
  - package.json
  - package-lock.json
  - tsconfig.json
  - ci/*.sh
  - .gitlab-ci.yml

.docker:
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - docker info > /dev/null

# Merge requests (and the default branch, before publish) — prove the images
# build and run. Never pushes.
build-validate:
  extends: .docker
  stage: validate
  rules:
    - if: $CI_COMMIT_TAG
    - changes: *image-paths
  script:
    - ./ci/build-images.sh "$CI_COMMIT_SHORT_SHA"
    - ./ci/smoke-images.sh "$CI_COMMIT_SHORT_SHA"

# Default branch and tags only. dind is a fresh daemon per job, so the images
# are rebuilt here (cache-hot from the registry's :latest) rather than handed
# over from the validate job.
publish:
  extends: .docker
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        VERSION: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *image-paths
      variables:
        VERSION: $CI_COMMIT_SHORT_SHA
  script:
    - ./ci/build-images.sh "$VERSION"
    - ./ci/smoke-images.sh "$VERSION"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - PUSH_LATEST=1 ./ci/push-images.sh "$VERSION"
